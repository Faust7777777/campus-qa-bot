[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "campus-qa-bot"
version = "0.1.0"
description = "Fail-closed campus knowledge retrieval and NoneBot2 service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "nonebot2[fastapi]>=2.4,<3",
  "nonebot-adapter-onebot>=2.4,<3",
  "sqlite-vec>=0.1.9,<0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[project.scripts]
campus-qa-kb = "luna_kb.pipeline.cli:main"
campus-qa-bot = "luna_kb.bot:main"

[tool.hatch.build.targets.wheel]
packages = ["src/luna_kb"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
